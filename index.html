<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0f766e" />
    <title>狼人杀发言记录器</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>狼人杀发言记录器</h1>
            <input id="sessionTitle" class="title-input" type="text" aria-label="对局标题" />
          </div>
        </div>
        <div class="top-actions">
          <button id="exportMdBtn" class="plain-btn" type="button">导出 MD</button>
          <button id="exportJsonBtn" class="plain-btn" type="button">导出 JSON</button>
          <button id="importBtn" class="plain-btn" type="button">导入</button>
          <input id="importFile" type="file" accept="application/json" hidden />
        </div>
      </header>

      <nav class="day-strip" aria-label="天数">
        <div id="dayTabs" class="day-tabs"></div>
        <button id="addDayBtn" class="add-day-btn" type="button">+ 天</button>
      </nav>

      <main class="workspace">
        <section class="seat-panel" aria-label="发言席位">
          <div class="panel-head">
            <div>
              <h2>发言席位</h2>
              <p id="activeSeatLabel"></p>
            </div>
            <select id="seatCountSelect" aria-label="席位数量">
              <option value="6">6人</option>
              <option value="7">7人</option>
              <option value="8">8人</option>
              <option value="9">9人</option>
              <option value="10">10人</option>
              <option value="12">12人</option>
              <option value="20">20人</option>
            </select>
          </div>
          <div id="seatGrid" class="seat-grid"></div>
          <label class="seat-name-line" for="activeSeatNameInput">
            <span>昵称</span>
            <input id="activeSeatNameInput" type="text" placeholder="可选" />
          </label>
        </section>

        <section class="record-panel" aria-label="发言记录">
          <div class="phase-bar" role="group" aria-label="阶段">
            <button data-phase="police" type="button">警上发言</button>
            <button data-phase="day" type="button">白天发言</button>
            <button data-phase="vote" type="button">投票发言</button>
            <button data-phase="other" type="button">补充记录</button>
          </div>

          <div class="manual-row">
            <select id="manualSeatSelect" aria-label="发言席位"></select>
            <textarea id="manualText" rows="3" placeholder="输入发言内容"></textarea>
            <button id="addManualBtn" class="primary-btn" type="button">记下</button>
          </div>

          <div class="filter-row">
            <input id="searchInput" type="search" placeholder="搜索发言" aria-label="搜索发言" />
            <select id="filterSeatSelect" aria-label="筛选席位"></select>
            <select id="filterDaySelect" aria-label="筛选天数"></select>
          </div>

          <div id="entryList" class="entry-list"></div>
        </section>

        <aside class="voice-panel" aria-label="语音转文字">
          <section class="transcribe-box">
            <div class="panel-head">
              <div>
                <h2>语音转文字</h2>
                <p id="transcribeStatus">待启动</p>
              </div>
            </div>

            <label class="toggle-pill">
              <input id="autoSeatToggle" type="checkbox" />
              句首识别座位号
            </label>

            <div class="transcribe-actions">
              <button id="startListenBtn" class="primary-btn" type="button">开始转写</button>
              <button id="stopListenBtn" class="danger-btn" type="button">停止</button>
            </div>

            <div id="interimText" class="interim-text"></div>
          </section>
        </aside>
      </main>

      <div class="mobile-voice-dock" aria-label="语音快捷控制">
        <span id="mobileTranscribeStatus">待启动</span>
        <button id="mobileStartListenBtn" class="primary-btn" type="button">开始</button>
        <button id="mobileStopListenBtn" class="danger-btn" type="button">停止</button>
      </div>
    </div>

    <template id="entryTemplate">
      <article class="entry-card">
        <div class="entry-meta"></div>
        <div class="entry-text"></div>
        <textarea class="entry-editor" rows="3"></textarea>
        <div class="entry-actions">
          <button class="copy-entry" type="button">复制</button>
          <button class="edit-entry" type="button">编辑</button>
          <button class="delete-entry" type="button">删除</button>
        </div>
      </article>
    </template>

    <script src="./app.js?v=5" type="module"></script>
  </body>
</html>
